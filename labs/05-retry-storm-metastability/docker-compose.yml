name: sre-lab05

x-hardening: &hardening
  image: sre-lab05-app:local
  read_only: true
  tmpfs:
    - /tmp:size=16m,nosuid,nodev
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cpus: "1.0"
  mem_limit: 256m
  memswap_limit: 256m

x-healthcheck: &healthcheck
  test:
    - "CMD"
    - "python"
    - "-c"
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
  interval: 2s
  timeout: 2s
  retries: 15
  start_period: 2s

services:
  backend:
    <<: *hardening
    build:
      context: ./app
    container_name: sre-lab05-backend
    command: ["python3", "/app/backend.py"]
    environment:
      SERVICE_MS: "20"
      CONCURRENCY: "4"
      MAX_QUEUE: "500"
    ports:
      - "127.0.0.1:8086:8080"
    healthcheck: *healthcheck

  frontend:
    <<: *hardening
    container_name: sre-lab05-frontend
    command: ["python3", "/app/frontend.py"]
    environment:
      BACKEND_URL: "http://backend:8080/work"
      RETRY_POLICY: "${RETRY_POLICY:-naive}"
      ATTEMPT_TIMEOUT_S: "0.2"
      MAX_RETRIES: "3"
      BACKOFF_BASE_S: "0.05"
      BACKOFF_CAP_S: "1.0"
      BUDGET_RATIO: "0.1"
      BUDGET_MAX: "10"
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck: *healthcheck

  loadclient:
    <<: *hardening
    profiles: ["client"]
    container_name: sre-lab05-loadclient
    command: ["python3", "/app/loadclient.py"]
    environment:
      TARGET_URL: "http://frontend:8080/work"
      RPS: "120"
      DURATION_S: "90"
      TIMEOUT_S: "2.0"
    depends_on:
      frontend:
        condition: service_healthy
