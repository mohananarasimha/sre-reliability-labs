apiVersion: v1
kind: Pod
metadata:
  name: loadclient
  namespace: lab04
  labels:
    app: loadclient
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loadclient
      image: sre-lab04-app:local
      imagePullPolicy: IfNotPresent
      command: ["python3", "/app/loadclient.py"]
      env:
        - name: TARGET_URL
          value: "http://api:8080/work?ms=300"
        - name: RPS
          value: "20"
        - name: DURATION_S
          value: "75"
        - name: TIMEOUT_S
          value: "3.0"
        - name: MAX_WORKERS
          value: "64"
      resources:
        requests:
          cpu: 50m
          memory: 48Mi
        limits:
          cpu: 300m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
