apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab03
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        profile: broken
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: sre-lab03-app:local
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/api.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LAB_PROFILE
              value: "broken"
            - name: WARMUP_SECONDS
              value: "12"
            - name: DOWNSTREAM_HOST
              value: "downstream"
            - name: DOWNSTREAM_PORT
              value: "8080"
            - name: WORK_TIMEOUT_S
              value: "1.5"
            - name: DEEP_HEALTH_TIMEOUT_S
              value: "0.9"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Broken probe configuration: liveness coupled to slow downstream, no startupProbe.
          livenessProbe:
            httpGet:
              path: /healthz/deep
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
