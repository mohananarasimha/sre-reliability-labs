version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/shared/loadgen"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/shared/observability"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/labs/01-cgroup-cpu-throttling"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/labs/01-cgroup-cpu-throttling/app"
    schedule:
      interval: "weekly"
    ignore:
      # Lab results were measured on python 3.12; take patch updates only.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directory: "/labs/02-oomkill-memory-pressure"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/labs/02-oomkill-memory-pressure/app"
    schedule:
      interval: "weekly"
    ignore:
      # Lab results were measured on python 3.12; take patch updates only.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/labs/03-k8s-probe-death-spiral/app"
    schedule:
      interval: "weekly"
    ignore:
      # Lab results were measured on python 3.12; take patch updates only.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/labs/04-k8s-drain-traffic-blackhole/app"
    schedule:
      interval: "weekly"
    ignore:
      # Lab results were measured on python 3.12; take patch updates only.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
