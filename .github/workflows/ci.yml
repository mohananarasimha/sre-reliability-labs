name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for accidental secrets or key material
        run: |
          if git grep -nE "(BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,})" -- ':(exclude).github/workflows/ci.yml'; then
            echo "Potential secret pattern detected in tracked files."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env(\.|$)|\.(pem|key)$|(^|/)kubeconfig'; then
            echo "Forbidden secret or kubeconfig file tracked in git."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync loadgen dependencies
        working-directory: shared/loadgen
        run: uv sync --python 3.12 --extra dev

      - name: Lint loadgen with ruff
        working-directory: shared/loadgen
        run: uv run ruff check .

      - name: Lint Lab 01 Python files with ruff
        run: shared/loadgen/.venv/bin/ruff check --select E,F,I,UP,B,S labs/01-cgroup-cpu-throttling/app labs/01-cgroup-cpu-throttling/cgroup_delta.py

      - name: Lint Lab 02 Python files with ruff
        run: shared/loadgen/.venv/bin/ruff check --select E,F,I,UP,B,S labs/02-oomkill-memory-pressure/app labs/02-oomkill-memory-pressure/summarize_oom.py

      - name: Lint Lab 03 Python and shell files
        run: |
          shared/loadgen/.venv/bin/ruff check --select E,F,I,UP,B,S labs/03-k8s-probe-death-spiral/app labs/03-k8s-probe-death-spiral/summarize.py
          bash -n labs/03-k8s-probe-death-spiral/run-experiment.sh

      - name: Lint Lab 04 Python and shell files
        run: |
          shared/loadgen/.venv/bin/ruff check --select E,F,I,UP,B,S labs/04-k8s-drain-traffic-blackhole/app labs/04-k8s-drain-traffic-blackhole/summarize.py
          bash -n labs/04-k8s-drain-traffic-blackhole/run-experiment.sh

      - name: Test loadgen with pytest
        working-directory: shared/loadgen
        run: uv run pytest -v

      - name: Validate shared observability compose config
        run: docker compose -f shared/observability/docker-compose.yml config -q

      - name: Validate Lab 01 compose config
        run: docker compose --profile broken --profile fixed -f labs/01-cgroup-cpu-throttling/docker-compose.yml config -q

      - name: Validate Lab 02 compose config
        run: docker compose --profile broken --profile fixed -f labs/02-oomkill-memory-pressure/docker-compose.yml config -q
