name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync loadgen dependencies
        working-directory: shared/loadgen
        run: uv sync --python 3.12 --extra dev

      - name: Lint loadgen with ruff
        working-directory: shared/loadgen
        run: uv run ruff check .

      - name: Test loadgen with pytest
        working-directory: shared/loadgen
        run: uv run pytest -v

      - name: Validate shared observability compose config
        run: docker compose -f shared/observability/docker-compose.yml config -q
